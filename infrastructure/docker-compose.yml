# Local two-node fileSync cluster for testing mTLS + peer sync.
# Before running:
#   1. cd infrastructure && ./scripts/gen-ca.sh ./ca
#   2. ./scripts/gen-server-cert.sh node-a node-a 127.0.0.1
#      ./scripts/gen-server-cert.sh node-b node-b 127.0.0.1
#   3. cp ./ca/ca.crt ./certs/node-a/ && cp ./ca/ca.crt ./certs/node-b/
#   4. export FILESYNC_SHARED_SECRET=$(openssl rand -hex 32)
#   5. docker compose -f infrastructure/docker-compose.yml up --build

services:
  node-a:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    container_name: filesync-node-a
    environment:
      FILESYNC_SHARED_SECRET: ${FILESYNC_SHARED_SECRET:?set FILESYNC_SHARED_SECRET}
      FILESYNC_UI_PORT: "3001"
    ports:
      - "3443:3443"
      - "127.0.0.1:3001:3001"
    volumes:
      - ./certs/node-a:/app/certs:ro
      - ./compose/node-a/config:/app/config:ro
      - node_a_data:/app/data
    networks:
      filesync:
        aliases: [node-a]

  node-b:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    container_name: filesync-node-b
    environment:
      FILESYNC_SHARED_SECRET: ${FILESYNC_SHARED_SECRET:?set FILESYNC_SHARED_SECRET}
      FILESYNC_UI_PORT: "3001"
    ports:
      - "3444:3443"
      - "127.0.0.1:3002:3001"
    volumes:
      - ./certs/node-b:/app/certs:ro
      - ./compose/node-b/config:/app/config:ro
      - node_b_data:/app/data
    networks:
      filesync:
        aliases: [node-b]

networks:
  filesync:
    driver: bridge

volumes:
  node_a_data:
  node_b_data:
